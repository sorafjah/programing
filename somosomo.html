<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>プログラミングそもそも</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --panel:#ffffff; --line:#d6dee8; --text:#2b3440; --sub:#5d6b7a;
  --main:#3a78c9; --mainLight:#e4eefa; --ok:#2f9a5a; --okLight:#e3f4ea;
  --ng:#d0654b; --ngLight:#fbe9e4; --run:#f0a830; --runLight:#fdf2dc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"BIZ UDPGothic",sans-serif;background:var(--bg);color:var(--text);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
svg text{font-family:"BIZ UDPGothic",sans-serif}
ruby rt{font-size:0.5em}
button{
  font-family:inherit;color:inherit;border:2px solid var(--line);background:#fff;
  border-radius:12px;min-width:44px;min-height:44px;cursor:pointer;
  touch-action:manipulation;
}
button:disabled{opacity:.45}
.screen{display:none;height:100%;width:100%}
.screen.show{display:flex}

/* ===== スタート画面 ===== */
#start{flex-direction:column;align-items:center;overflow-y:auto;padding:24px 20px}
#start h1{font-size:34px;margin:8px 0 10px;color:var(--main)}
.lead{font-size:19px;line-height:2;text-align:center;color:var(--sub);margin-bottom:18px}
.stageList{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:860px;margin-bottom:22px}
.stageBtn{width:250px;padding:16px;text-align:left;border-color:var(--main);background:var(--panel)}
.stageBtn .num{font-size:15px;color:var(--main);font-weight:700}
.stageBtn .name{font-size:22px;font-weight:700;margin:6px 0 4px;line-height:1.7}
.stageBtn .clear{font-size:15px;color:var(--ok);font-weight:700;min-height:1.4em}
.settings{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 18px;max-width:640px;width:100%}
.settings h2{font-size:17px;color:var(--sub);margin-bottom:8px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;flex-wrap:wrap}
.setRow .lbl{font-size:17px;line-height:1.8}
.seg{display:flex;gap:6px}
.seg button{padding:6px 14px;font-size:16px}
.seg button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}

/* ===== 活動画面 ===== */
#play{flex-direction:column;padding:10px 14px;gap:10px}
.topBar{display:flex;align-items:center;gap:10px}
.topBar .back{font-size:16px;padding:6px 12px}
.topBar .title{font-size:22px;font-weight:700;flex:1;line-height:1.7}
.topBar .try{font-size:16px;color:var(--sub)}
.mainArea{flex:1;display:flex;gap:12px;min-height:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.sceneP{flex:1.25;display:flex;flex-direction:column;gap:8px;min-height:0}
.goal{font-size:17px;line-height:1.9;background:var(--mainLight);border-radius:10px;padding:6px 12px}
.sceneWrap{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center}
#scene{width:100%;height:100%;max-height:100%}
.bubble{
  position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:8px 14px;font-size:20px;line-height:1.9;min-height:3.2em;
}
.bubble::before{
  content:"";position:absolute;left:28%;top:-12px;border:10px solid transparent;
  border-bottom-color:var(--line);border-top:0;
}
.bubble.ok{border-color:var(--ok);background:var(--okLight)}
.bubble.ng{border-color:var(--ng);background:var(--ngLight)}
.state{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:15px;line-height:1.8;padding:2px 10px;border-radius:20px;background:#eef1f5;border:1px solid var(--line)}
.chip.changed{background:var(--runLight);border-color:var(--run)}

.prog{flex:0.9;display:flex;flex-direction:column;gap:8px;min-height:0}
.progHead{font-size:17px;font-weight:700;line-height:1.8;display:flex;justify-content:space-between;align-items:center}
.progHead .cnt{font-size:15px;color:var(--sub);font-weight:400}
#progList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.empty{color:var(--sub);font-size:17px;line-height:1.9;padding:10px}
.pCard{
  display:flex;align-items:center;gap:8px;border:2px solid var(--main);border-radius:10px;
  background:#fff;padding:4px 8px;min-height:46px;font-size:18px;line-height:1.7;width:100%;
  touch-action:none;cursor:grab;flex-shrink:0;
}
.pCard .grip{color:#9aa7b5;font-size:18px;letter-spacing:-2px;flex-shrink:0}
.pCard .no{
  width:30px;height:30px;border-radius:50%;background:var(--main);color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;
}
.pCard .txt{flex:1}
.pCard .del{font-size:14px;color:var(--sub)}
.pCard.now{border-color:var(--run);background:var(--runLight)}
.pCard.now .no{background:var(--run)}
.pCard.done{border-color:var(--ok)}
.pCard.done .no{background:var(--ok)}
.pCard.fail{border-color:var(--ng);background:var(--ngLight)}
.pCard.fail .no{background:var(--ng)}
.pCard .mark{font-size:14px;font-weight:700}
.pCard.fail .mark{color:var(--ng)}
.pCard.dragging{opacity:.3;border-style:dashed}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:scale(1.03);background:#fff}
.ctrl{display:flex;gap:8px}
.ctrl button{flex:1;font-size:20px;font-weight:700;padding:8px}
#runBtn{background:var(--main);border-color:var(--main);color:#fff}
#runBtn.stop{background:#fff;color:var(--ng);border-color:var(--ng)}

.palette{display:flex;flex-direction:column;gap:6px}
.palHead{font-size:16px;color:var(--sub);line-height:1.8}
#palList{display:flex;flex-wrap:wrap;gap:8px}
.cardBtn{font-size:19px;line-height:1.7;padding:6px 14px;border-color:var(--main);background:var(--mainLight);font-weight:700}
#msg{font-size:17px;line-height:1.9;min-height:1.9em;color:var(--sub)}
#msg.ng{color:var(--ng);font-weight:700}
#msg.ok{color:var(--ok);font-weight:700}

/* ===== 場面のアニメーション ===== */
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
.steam{animation:steam 1.8s ease-out infinite}
.steam2{animation-delay:.6s}.steam3{animation-delay:1.2s}
@keyframes pour{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
.pour{stroke-dasharray:8 6;animation:pour .5s linear infinite}
@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.fall{animation:fall .9s ease-in infinite}
.fall2{animation-delay:.3s}.fall3{animation-delay:.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.spinSlow{animation:spin 3s linear infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1.15);opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 1s ease-out infinite}
.pop2{animation-delay:.33s}.pop3{animation-delay:.66s}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.fxText{animation:jump .6s ease-in-out infinite}

/* ===== 結果画面 ===== */
#result{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#result h2{font-size:40px;color:var(--ok)}
#resRobot{width:130px;height:195px}
.resInfo{font-size:22px;line-height:2}
.resBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.resBtns button{font-size:20px;padding:10px 22px;font-weight:700}
.resBtns .primary{background:var(--main);border-color:var(--main);color:#fff}

/* iPad縦向き */
@media (orientation:portrait){
  .mainArea{flex-direction:column}
  .sceneP{flex:1.3}
  .prog{flex:1}
}
/* スマホ横向き */
@media (orientation:landscape) and (max-height:500px){
  #play{padding:6px 8px;gap:6px}
  .topBar .title{font-size:17px}
  .topBar .back{min-height:38px}
  .panel{padding:6px}
  .goal{display:none}
  .bubble{font-size:14px;min-height:2.6em;padding:4px 10px}
  .chip{font-size:12px}
  .progHead{font-size:14px}
  .pCard{font-size:14px;min-height:38px}
  .pCard .no{width:24px;height:24px;font-size:12px}
  .cardBtn{font-size:14px;padding:4px 10px;min-height:38px}
  .ctrl button{font-size:16px;padding:4px;min-height:38px}
  #msg{font-size:14px}
  .palHead{display:none}
  #start h1{font-size:26px}
  .stageBtn{width:200px}
  .stageBtn .name{font-size:18px}
  #resRobot{width:80px;height:120px}
  #result h2{font-size:28px}
  .resInfo{font-size:17px}
}
/* スマホ縦向き */
@media (orientation:portrait) and (max-width:500px){
  #play{padding:6px 8px;gap:6px}
  .topBar .title{font-size:16px}
  .panel{padding:6px}
  .goal{font-size:13px;padding:2px 8px}
  .bubble{font-size:14px;min-height:2.6em;padding:4px 10px}
  .chip{font-size:12px}
  .pCard{font-size:15px;min-height:38px}
  .cardBtn{font-size:15px;padding:4px 10px;min-height:38px}
  .ctrl button{font-size:17px;min-height:40px}
  #msg{font-size:14px}
  .palHead{font-size:13px}
  #start h1{font-size:26px}
  .lead{font-size:16px}
  .stageBtn{width:100%}
}
</style>
</head>
<body>

<!-- スタート画面 -->
<div id="start" class="screen show">
  <h1>プログラミングそもそも</h1>
  <p class="lead">ロボットは、いわれた とおりにしか うごかないよ。<br>
    カードを じゅんばんに ならべて、ロボットに おねがいしてね。</p>
  <div class="stageList" id="stageList"></div>
  <div class="settings">
    <h2><ruby>先生<rt>せんせい</rt></ruby>の せってい</h2>
    <div class="setRow">
      <span class="lbl">うごく はやさ</span>
      <div class="seg" data-key="speed">
        <button data-v="slow">ゆっくり</button><button data-v="normal">ふつう</button>
      </div>
    </div>
    <div class="setRow">
      <span class="lbl">いらない カードを まぜる</span>
      <div class="seg" data-key="extra">
        <button data-v="on">まぜる</button><button data-v="off">まぜない</button>
      </div>
    </div>
    <div class="setRow">
      <span class="lbl"><ruby>音<rt>おと</rt></ruby></span>
      <div class="seg" data-key="sound">
        <button data-v="on">あり</button><button data-v="off">なし</button>
      </div>
    </div>
  </div>
</div>

<!-- 活動画面 -->
<div id="play" class="screen">
  <div class="topBar">
    <button class="back" id="backBtn">もどる</button>
    <div class="title" id="stageTitle"></div>
    <div class="try" id="tryCount"></div>
  </div>
  <div class="mainArea">
    <div class="panel sceneP">
      <div class="goal" id="goalText"></div>
      <div class="sceneWrap"><svg id="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div class="bubble" id="bubble"></div>
      <div class="state" id="stateBox"></div>
    </div>
    <div class="panel prog">
      <div class="progHead">
        <span>おねがいの じゅんばん</span><span class="cnt" id="progCnt"></span>
      </div>
      <div id="progList"></div>
      <div class="ctrl">
        <button id="clearBtn">ぜんぶ けす</button>
        <button id="runBtn">うごかす</button>
      </div>
    </div>
  </div>
  <div class="panel palette">
    <div class="palHead">カードを タップすると、じゅんばんの さいごに ならぶよ。ならんだ カードは、ドラッグで じゅんばんを かえられるよ。タップすると けせるよ。</div>
    <div id="palList"></div>
    <div id="msg"></div>
  </div>
</div>

<!-- 結果画面 -->
<div id="result" class="screen">
  <h2>できたね！</h2>
  <svg id="resRobot" viewBox="0 0 130 195"></svg>
  <div class="resInfo" id="resInfo"></div>
  <div class="resBtns" id="resBtns"></div>
</div>

<script>
/* ---------- ふりがな ---------- */
// {漢字|かんじ} を ruby に変換
function r(s){return s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');}

/* ---------- 設定（localStorage は try/catch） ---------- */
const settings={speed:'slow',extra:'off',sound:'on'};
let cleared={};
function load(){
  try{
    const s=JSON.parse(localStorage.getItem('robotOnegai_settings')||'null');
    if(s)Object.assign(settings,s);
    cleared=JSON.parse(localStorage.getItem('robotOnegai_cleared')||'{}')||{};
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem('robotOnegai_settings',JSON.stringify(settings));
    localStorage.setItem('robotOnegai_cleared',JSON.stringify(cleared));
  }catch(e){}
}

/* ---------- 効果音 ---------- */
let actx=null;
function unlockAudio(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
}
function tone(freq,dur,when,vol){
  if(settings.sound!=='on'||!actx)return;
  try{
    const t=actx.currentTime+(when||0);
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
const sndStep=()=>tone(660,0.12);
const sndOk=()=>{tone(523,0.18,0);tone(659,0.18,0.15);tone(784,0.3,0.3);};
const sndNg=()=>{tone(392,0.2,0,0.08);tone(330,0.3,0.18,0.08);};
const sndTap=()=>tone(880,0.06,0,0.06);

/* ---------- 絵のパーツ ---------- */
const ST='stroke="#7d8a99" stroke-width="3"';
function fxText(t,x,y){return `<g class="fxText"><text x="${x||385}" y="${y||34}" text-anchor="end" font-size="24" font-weight="700" fill="#e08a2c" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text></g>`;}
function room(wall){
  return `<rect x="0" y="0" width="400" height="240" fill="${wall||'#f7f9fc'}"/>
  <rect x="0" y="222" width="400" height="18" fill="#e3e8ee"/>`;
}
function table(){
  return `<rect x="200" y="150" width="195" height="10" rx="3" fill="#e9d3b0" stroke="#b99a6e" stroke-width="2"/>
  <rect x="212" y="160" width="9" height="62" fill="#d9bf95"/><rect x="374" y="160" width="9" height="62" fill="#d9bf95"/>`;
}

/* ---------- ロボット（脚つき） ---------- */
// ローカル座標：はば130・高さ195。右うでは かた(100,114)を中心に回る
function robotSVG(face,hand){
  const eyeL=face==='happy'?'<path d="M40 62 q8 -9 16 0" stroke="#2b3440" stroke-width="4" fill="none" stroke-linecap="round"/>'
    :face==='sad'?'<path d="M40 58 l14 -5" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="66" r="5" fill="#2b3440"/>'
    :face==='sleep'?'<path d="M40 64 h16" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/>'
    :'<circle cx="48" cy="62" r="7" fill="#2b3440"/>';
  const eyeR=face==='happy'?'<path d="M74 62 q8 -9 16 0" stroke="#2b3440" stroke-width="4" fill="none" stroke-linecap="round"/>'
    :face==='sad'?'<path d="M90 58 l-14 -5" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/><circle cx="82" cy="66" r="5" fill="#2b3440"/>'
    :face==='sleep'?'<path d="M74 64 h16" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/>'
    :'<circle cx="82" cy="62" r="7" fill="#2b3440"/>';
  const mouth=face==='happy'?'<path d="M48 80 q17 14 34 0" stroke="#2b3440" stroke-width="4" fill="none" stroke-linecap="round"/>'
    :face==='sad'?'<path d="M48 86 q8 -7 17 0 q8 7 17 0" stroke="#2b3440" stroke-width="4" fill="none" stroke-linecap="round"/>'
    :face==='work'?'<rect x="54" y="78" width="22" height="9" rx="4" fill="#2b3440"/>'
    :'<path d="M52 82 h26" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/>';
  const lamp=face==='happy'?'#2f9a5a':face==='sad'?'#d0654b':face==='work'?'#f0a830':'#3a78c9';
  const P='fill="#c9d6e6" stroke="#8a97a6" stroke-width="3"';
  return `<g class="rbBob">
    <g class="legL"><rect x="45" y="146" width="14" height="34" rx="5" ${P}/><rect x="38" y="178" width="26" height="12" rx="6" fill="#8a97a6"/></g>
    <g class="legR"><rect x="71" y="146" width="14" height="34" rx="5" ${P}/><rect x="66" y="178" width="26" height="12" rx="6" fill="#8a97a6"/></g>
    <rect x="36" y="104" width="58" height="46" rx="10" ${P}/>
    <circle cx="65" cy="124" r="6" fill="${lamp}"/>
    <g class="armL"><rect x="24" y="108" width="12" height="36" rx="6" ${P}/><circle cx="30" cy="148" r="7" fill="#8a97a6"/></g>
    <line x1="65" y1="12" x2="65" y2="30" stroke="#8a97a6" stroke-width="4"/>
    <circle cx="65" cy="10" r="7" fill="${lamp}"/>
    <rect x="22" y="30" width="86" height="70" rx="18" fill="#dfe7f1" stroke="#8a97a6" stroke-width="3"/>
    ${eyeL}${eyeR}${mouth}
    <g class="armR"><rect x="94" y="108" width="12" height="36" rx="6" ${P}/><circle cx="100" cy="148" r="7" fill="#8a97a6"/>${hand||''}</g>
  </g>`;
}
const RB_X=70, RB_Y=32; // 場面の中のロボットの位置
const MOUTH={x:RB_X+65,y:RB_Y+84};

/* ---------- いらないカード（共通） ---------- */
const EXTRA_CARDS=[
  {id:'dance',label:'おどる',extra:true,pose:'dance',fx:()=>fxText('♪ ♪'),run:()=>({ok:true,msg:'くるくる おどったよ。たのしい！'})},
  {id:'sleep',label:'ねる',extra:true,pose:'rest',face:'sleep',fx:()=>fxText('Zzz…',190,40),run:()=>({ok:true,msg:'すやすや…。あ、おきたよ。'})}
];

/* ---------- ステージ ---------- */
const STAGES=[
/* ===== カップラーメン ===== */
{
  id:'ramen',
  title:'カップラーメンを {作|つく}る',
  goal:'カップラーメンを {作|つく}って、{食|た}べるまで おねがいしてね。',
  init:()=>({lid:'しまっている',kayaku:false,water:false,waited:false,eaten:false,spill:false,kayakuLid:false}),
  view:s=>[
    'ふた：'+s.lid,
    'かやく：'+(s.kayaku?'{入|はい}っている':'{入|はい}っていない'),
    'お{湯|ゆ}：'+(s.water?'{入|はい}っている':'{入|はい}っていない'),
    'めん：'+(s.waited?'やわらかい':'かたい')
  ],
  draw:(s,fx)=>{
    const open=s.lid==='あいている';
    let o=room()+table();
    if(s.spill)o+=`<ellipse cx="290" cy="151" rx="78" ry="6" fill="#9cc8ee" opacity=".85"/><ellipse cx="225" cy="222" rx="30" ry="4" fill="#9cc8ee" opacity=".8"/>`;
    // カップ
    o+=`<polygon points="250,95 330,95 320,150 260,150" fill="#fff" ${ST}/>
      <polygon points="252,108 328,108 326,124 254,124" fill="#e8806a"/>
      <text x="290" y="142" text-anchor="middle" font-size="11" fill="#7d8a99" font-weight="700">ラーメン</text>`;
    if(open){
      o+=`<ellipse cx="290" cy="95" rx="40" ry="7" fill="${s.water?'#f2d79a':'#efe8d8'}" ${ST}/>`;
      o+=s.waited?`<path d="M262 95 q6 -6 12 0 t12 0 t12 0 t12 0 t12 0" stroke="#e0b84a" stroke-width="3" fill="none"/>`
                 :`<path d="M262 96 l6 -4 l6 4 l6 -4 l6 4 l6 -4 l6 4 l6 -4 l6 4 l6 -4 l6 4" stroke="#c99a35" stroke-width="2.5" fill="none"/>`;

/* ---------- 状態 ---------- */
let stage=null, state=null, program=[], tries=0;
let running=false, runIdx=0, runTimer=0, prevView=[], runId=0;
let face='normal', fx=null, pose='rest', actT=99, bounceT=0;
let marks=null;

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('show',e.id===id));}

/* ---------- 場面を描く ---------- */
function renderScene(){
  if(!stage)return;
  const hand=stage.hand?stage.hand(state):'';
  let fxSvg='';
  // いらないカードの動作の絵
  if(fx&&fx.extra){const c=EXTRA_CARDS.find(c=>c.id===fx.id);if(c&&c.fx)fxSvg=c.fx();}
  $('scene').innerHTML=stage.draw(state,fx&&!fx.extra?fx:null)
    +`<g transform="translate(${RB_X},${RB_Y})">${robotSVG(face,hand)}</g>`+fxSvg;
}

/* ---------- スタート画面 ---------- */
function buildStart(){
  const list=$('stageList');list.innerHTML='';
  STAGES.forEach((st,i)=>{
    const b=document.createElement('button');b.className='stageBtn';
    b.innerHTML=`<div class="num">ステージ ${i+1}</div><div class="name">${r(st.title)}</div><div class="clear">${cleared[st.id]?'できたよ ✓':''}</div>`;
    b.addEventListener('click',()=>{unlockAudio();sndTap();startStage(i);});
    list.appendChild(b);
  });
  document.querySelectorAll('.seg').forEach(seg=>{
    const key=seg.dataset.key;
    seg.querySelectorAll('button').forEach(btn=>btn.classList.toggle('on',settings[key]===btn.dataset.v));
  });
}
document.querySelectorAll('.seg').forEach(seg=>{
  seg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      unlockAudio();
      settings[seg.dataset.key]=btn.dataset.v;save();buildStart();sndTap();
    });
  });
});

/* ---------- 活動画面 ---------- */
let stageIndex=0;
function startStage(i){
  stageIndex=i;stage=STAGES[i];program=[];tries=0;
  resetRun();
  $('stageTitle').innerHTML='ステージ '+(i+1)+'：'+r(stage.title);
  $('goalText').innerHTML=r(stage.goal);
  buildPalette();renderProg();
  setBubble('よろしくね。カードで おねがいしてね。','');
  setMsg('','');
  updateTry();
  show('play');
}
function allCards(){return settings.extra==='on'?stage.cards.concat(EXTRA_CARDS):stage.cards;}
function findCard(id){return stage.cards.find(c=>c.id===id)||EXTRA_CARDS.find(c=>c.id===id);}
function buildPalette(){
  const pl=$('palList');pl.innerHTML='';
  allCards().forEach(c=>{
    const b=document.createElement('button');b.className='cardBtn';b.innerHTML=r(c.label);
    b.addEventListener('click',()=>{
      unlockAudio();
      if(running)return;
      if(program.length>=10){setMsg('カードは 10まいまで だよ。','ng');return;}
      clearMarks();
      program.push(c.id);sndTap();renderProg();
      const l=$('progList');l.scrollTop=l.scrollHeight;
    });
    pl.appendChild(b);
  });
}
function renderProg(){
  const pl=$('progList');pl.innerHTML='';
  if(program.length===0)pl.innerHTML='<div class="empty">'+r('まだ カードが ないよ。<br>{下|した}の カードを タップしてね。')+'</div>';
  program.forEach((id,i)=>{
    const c=findCard(id);
    const d=document.createElement('div');d.className='pCard';d.dataset.i=i;
    const m=marks&&marks[i];
    if(m)d.classList.add(m);
    const markTxt=m==='fail'?'<span class="mark">ここで うまく いかなかったよ</span>'
      :m==='done'?'<span class="mark" style="color:var(--ok)">できた</span>':'';
    d.innerHTML=`<span class="grip">⋮⋮</span><span class="no">${i+1}</span><span class="txt">${r(c.label)}</span>${markTxt||(running?'':'<span class="del">けす</span>')}`;
    setupDrag(d,i);
    pl.appendChild(d);
  });
  // うごいているカードが見えるように一覧をスクロール
  const cur=pl.querySelector('.pCard.now,.pCard.fail');
  if(cur){const lr=pl.getBoundingClientRect(),cr=cur.getBoundingClientRect();
    if(cr.top<lr.top||cr.bottom>lr.bottom)pl.scrollTop+=cr.top-lr.top-lr.height/2+cr.height/2;}
  $('progCnt').textContent=program.length+' まい';
  $('clearBtn').disabled=running||program.length===0;
}

/* ---------- ならべかえ（ドラッグ）とタップでけす ---------- */
let drag=null;
function setupDrag(el,i){
  el.addEventListener('pointerdown',e=>{
    if(running||drag)return;
    unlockAudio();
    const rc=el.getBoundingClientRect();
    drag={el,i,sx:e.clientX,sy:e.clientY,ox:e.clientX-rc.left,oy:e.clientY-rc.top,moved:false,ghost:null,id:e.pointerId};
    e.preventDefault();
  });
}
// うごきと はなしたときは window で受ける（DOMの入れかえでイベントが切れないように）
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const el=drag.el;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;
    drag.moved=true;
    const rc=el.getBoundingClientRect();
    const g=el.cloneNode(true);g.classList.remove('pCard');g.classList.add('pCard-ghost','ghost');
    g.style.cssText+=';display:flex;align-items:center;gap:8px;border:2px solid var(--main);border-radius:10px;padding:4px 8px;min-height:46px;font-size:18px;line-height:1.7;width:'+rc.width+'px';
    document.body.appendChild(g);drag.ghost=g;
    el.classList.add('dragging');
    clearMarks();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';
  drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  // 入れる場所を決める
  const list=$('progList');
  const others=[...list.querySelectorAll('.pCard')].filter(x=>x!==el);
  let before=null;
  for(const o of others){const rc=o.getBoundingClientRect();if(e.clientY<rc.top+rc.height/2){before=o;break;}}
  if(before){if(el.nextElementSibling!==before)list.insertBefore(el,before);}
  else if(list.lastElementChild!==el)list.appendChild(el);
  // はしに来たら一覧をスクロール
  const lr=list.getBoundingClientRect();
  if(e.clientY<lr.top+30)list.scrollTop-=8;
  else if(e.clientY>lr.bottom-30)list.scrollTop+=8;
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();
  if(d.moved){
    program=[...$('progList').querySelectorAll('.pCard')].map(x=>program[+x.dataset.i]);
    sndTap();renderProg();
  }else if(!cancel&&d.el.contains(e.target)){
    clearMarks();
    program.splice(d.i,1);sndTap();renderProg();
  }else renderProg();
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

function clearMarks(){
  if(marks){
    marks=null;setMsg('','');
    // 場面ももとにもどす
    state=stage.init();fx=null;face='normal';prevView=[];renderState();renderScene();
    if(!drag)renderProg();
  }
}
function setBubble(t,cls){const b=$('bubble');b.innerHTML=r(t);b.className='bubble'+(cls?' '+cls:'');}
function setMsg(t,cls){const m=$('msg');m.innerHTML=r(t);m.className=cls||'';}
function updateTry(){$('tryCount').textContent=tries>0?tries+'かいめ':'';}
function renderState(){
  const v=stage.view(state);
  $('stateBox').innerHTML=v.map((t,i)=>`<span class="chip${prevView.length&&prevView[i]!==t?' changed':''}">${r(t)}</span>`).join('');
  prevView=v;
}
function resetRun(){
  runId++;
  running=false;runIdx=0;runTimer=0;marks=null;fx=null;pose='rest';actT=99;
  state=stage.init();prevView=[];renderState();
  face='normal';renderScene();
  const rb=$('runBtn');rb.textContent='うごかす';rb.classList.remove('stop');
}

$('runBtn').addEventListener('click',()=>{
  unlockAudio();
  if(running){ // とめる
    resetRun();renderProg();
    setBubble('とまったよ。','');setMsg('','');
    return;
  }
  if(program.length===0){setMsg('カードを ならべてから {押|お}してね。','ng');return;}
  tries++;updateTry();
  runId++;
  state=stage.init();prevView=[];renderState();fx=null;
  running=true;runIdx=0;marks=program.map(()=>null);
  const rb=$('runBtn');rb.textContent='とめる';rb.classList.add('stop');
  setMsg('ロボットが うごいているよ…','');
  setBubble('いくよ！','');
  face='work';renderScene();
  renderProg();
  runTimer=stepInterval()*0.5;
});
$('clearBtn').addEventListener('click',()=>{
  unlockAudio();
  if(running)return;
  program=[];sndTap();clearMarks();renderProg();setMsg('','');
});
$('backBtn').addEventListener('click',()=>{
  unlockAudio();
  resetRun();buildStart();show('start');
});

function stepInterval(){return settings.speed==='slow'?2.4:1.5;}

function doStep(){
  const c=findCard(program[runIdx]);
  for(let k=0;k<runIdx;k++)marks[k]='done';
  marks[runIdx]='now';
  const res=c.run(state);
  fx={id:c.id,ok:res.ok,extra:!!c.extra};
  pose=c.pose||'reach';actT=0;bounceT=0.35;
  renderState();
  if(!res.ok){
    marks[runIdx]='fail';
    running=false;
    face='sad';renderScene();
    setBubble(res.msg,'ng');
    setMsg('うまく いかなかったよ。カードを なおして、もういちど うごかしてみてね。','ng');
    sndNg();
    const rb=$('runBtn');rb.textContent='うごかす';rb.classList.remove('stop');
    renderProg();
    return;
  }
  face=c.face||'work';renderScene();
  setBubble(res.msg,'');
  sndStep();
  renderProg();
  runIdx++;
  if(runIdx>=program.length){
    const id=runId;
    setTimeout(()=>{if(id===runId&&running)finishRun();},Math.min(1600,stepInterval()*700));
  }
}
function finishRun(){
  if(!stage)return;
  running=false;
  for(let k=0;k<marks.length;k++)if(marks[k]!=='fail')marks[k]='done';
  const rb=$('runBtn');rb.textContent='うごかす';rb.classList.remove('stop');
  if(stage.done(state)){
    face='happy';fx=null;pose='rest';renderScene();
    setBubble('ぜんぶ できたよ！ありがとう。','ok');
    setMsg('せいこう！','ok');
    renderProg();
    sndOk();
    cleared[stage.id]=true;save();
    const id=runId;
    setTimeout(()=>{if(id===runId)showResult();},1600);
  }else{
    face='sad';renderScene();
    setBubble(stage.notDone,'ng');
    setMsg('カードが たりないみたい。つづきの カードを たしてみてね。','ng');
    renderProg();
    sndNg();
  }
}

/* ---------- 結果画面 ---------- */
function showResult(){
  $('resRobot').innerHTML=robotSVG('happy','');
  const usedExtra=program.some(id=>EXTRA_CARDS.find(c=>c.id===id));
  let info='「'+r(stage.title)+'」 クリア！<br>'+tries+'かいめで せいこう ／ カード '+program.length+'まい';
  if(settings.extra==='on'&&!usedExtra)info+='<br>いらない カードを つかわずに できたね。';
  $('resInfo').innerHTML=info;
  const box=$('resBtns');box.innerHTML='';
  const addBtn=(label,cls,fn)=>{
    const b=document.createElement('button');b.innerHTML=label;if(cls)b.className=cls;
    b.addEventListener('click',()=>{unlockAudio();sndTap();fn();});box.appendChild(b);
  };
  if(stageIndex<STAGES.length-1)addBtn('つぎの ステージへ','primary',()=>startStage(stageIndex+1));
  addBtn('もういちど','',()=>startStage(stageIndex));
  addBtn('ステージを えらぶ','',()=>{buildStart();show('start');});
  show('result');
}

/* ---------- ロボットのうごき（デルタタイム方式） ---------- */
const ANG={rest:8,reach:-78,mouth:146};
let last=performance.now(), t=0;
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>1/30)dt=1/30;
  if(dt<0)dt=0;
  const dtScale=dt*60; // 60fps を 1 とする
  t+=dt;
  if(running){
    runTimer+=dt;
    if(runTimer>=stepInterval()&&runIdx<program.length){runTimer=0;doStep();}
  }
  actT+=dt;
  if(bounceT>0)bounceT=Math.max(0,bounceT-dt);

  const sc=$('scene');
  const bob=sc.querySelector('.rbBob');
  if(bob){
    // うでの角度：のばす→しばらくそのまま→もどす
    const hold=stepInterval()*0.55;
    let k=actT<0.35?ease(actT/0.35):actT<hold?1:1-ease((actT-hold)/0.35);
    let ang;
    if(pose==='dance'&&actT<hold+0.35)ang=-30+Math.sin(t*9)*45;
    else ang=ANG.rest+((ANG[pose]!==undefined?ANG[pose]:ANG.rest)-ANG.rest)*k;
    const arm=sc.querySelector('.armR');
    if(arm)arm.setAttribute('transform',`rotate(${ang.toFixed(1)} 100 114)`);
    const armL=sc.querySelector('.armL');
    if(armL){
      const a=pose==='dance'&&actT<hold+0.35?Math.sin(t*9+1)*40:Math.sin(t*1.5)*3;
      armL.setAttribute('transform',`rotate(${a.toFixed(1)} 30 114)`);
    }
    // 足ぶみ（うごき始めだけ）
    const walk=actT<0.6&&pose!=='rest'?Math.sin(actT*22)*4:0;
    const lL=sc.querySelector('.legL'),lR=sc.querySelector('.legR');
    if(lL)lL.setAttribute('transform',`translate(0,${Math.min(0,walk).toFixed(1)})`);
    if(lR)lR.setAttribute('transform',`translate(0,${Math.min(0,-walk).toFixed(1)})`);
    // ゆらゆら・ぴょん
    let y=Math.sin(t*2)*1.5;
    if(bounceT>0)y-=Math.sin((0.35-bounceT)/0.35*Math.PI)*6;
    if(face==='happy')y-=Math.abs(Math.sin(t*5))*6;
    bob.setAttribute('transform',`translate(0,${y.toFixed(2)})`);
  }
  const rb=$('resRobot').querySelector('.rbBob');
  if(rb&&$('result').classList.contains('show')){
    rb.setAttribute('transform',`translate(0,${(-Math.abs(Math.sin(t*3))*8+4).toFixed(2)})`);
    const a=rb.querySelector('.armR');
    if(a)a.setAttribute('transform',`rotate(${(-150+Math.sin(t*8)*20).toFixed(1)} 100 114)`);
  }
  void dtScale;
  requestAnimationFrame(loop);
}

/* ---------- ズーム・意図しない動作の防止 ---------- */
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<300)e.preventDefault();
  lastTouch=now;
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(drag){e.preventDefault();return;}
  if(e.target.closest&&e.target.closest('#progList,#start'))return; // 一覧とスタート画面はスクロールできる
  e.preventDefault();
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- 開始 ---------- */
load();buildStart();
stage=STAGES[0];state=stage.init();
requestAnimationFrame(t0=>{last=t0;requestAnimationFrame(loop);});
</script>
